<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吹牛骰子">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>吹牛骰子</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS「添加到主屏幕」用的图标：没有它 iPhone 桌面会显示网页截图 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="f350.css">
</head>
<body>

<!-- ==================== 首页：先选单机 / 联机，再选玩法 ==================== -->
<div class="page page-home" id="pageHome">

  <div class="home">
    <div class="home-head">
      <div class="home-t1">骰子</div>
      <div class="home-t2">DICE</div>
    </div>

    <div class="home-cards">
      <!-- 单人：一台手机轮流玩，现有两个玩法都在这里 -->
      <button class="mode-card" id="modeSolo">
        <span class="mc-top">
          <svg class="mc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="8.6" cy="8.6" r="1.5" fill="currentColor"/>
            <circle cx="15.4" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="8.6" cy="15.4" r="1.5" fill="currentColor"/>
          </svg>
          <span class="mc-title">单人模式</span>
        </span>
        <span class="mc-sub">一台手机，大家轮着玩</span>
      </button>

      <!-- 联机：先占位。真做的时候主机是安卓端，其他手机浏览器当客户端 -->
      <button class="mode-card is-soon" id="modeNet">
        <span class="mc-top">
          <svg class="mc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5a12.5 12.5 0 0 1 16 0" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <path d="M7 13a8.2 8.2 0 0 1 10 0" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="17.6" r="1.7" fill="currentColor"/>
          </svg>
          <span class="mc-title">联机模式</span>
          <span class="mc-badge">开发中</span>
        </span>
        <span class="mc-sub">每人一台手机 · 连同一个 WiFi</span>
      </button>
    </div>

    <div class="home-tip" id="homeTip"></div>

    <div class="home-foot" id="homeVer">v1.10.4 · 仅供朋友聚会娱乐</div>
  </div>
</div>

<!-- ==================== 单人模式：选玩法 ==================== -->
<div class="page page-solo" id="pageSolo" hidden>

  <div class="home">
    <button class="nav-back" id="soloBack" aria-label="返回首页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.6 4.8 7.4 12l7.2 7.2"/>
      </svg>
    </button>

    <!-- 标题 + 卡片包一层：让这一组在整页里垂直居中，别都挤在顶上 -->
    <div class="solo-body">
      <div class="home-head">
        <div class="home-t1">单人</div>
        <div class="home-t2">SOLO</div>
      </div>

      <div class="home-cards">
      <!-- 两个玩法的入口都摆在这一层，不再塞进玩法页的底栏 -->
      <button class="play-card" id="playLiar" data-play="liar">
        <span class="pc-top">
          <svg class="pc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.6 7.2h16.8" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="4.4" r="1.3" fill="currentColor"/>
            <path d="M6.1 10.4h11.8c0 5-2.5 8.6-5.9 8.6s-5.9-3.6-5.9-8.6z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
          </svg>
          <span class="pc-title">吹牛骰子</span>
          <span class="pc-badge" id="badgeLiar" hidden>上次玩的</span>
        </span>
        <span class="pc-sub">有盖子 · 摇完掀盖看点数，靠嘴吹</span>
      </button>

      <button class="play-card" id="playF350" data-play="f350">
        <span class="pc-top">
          <svg class="pc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="6.2" rx="7" ry="2.5" fill="none"
                     stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 6.2v4.4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6.2"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 10.6v4.4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-4.4"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span class="pc-title">潮汕 350</span>
          <span class="pc-badge" id="badgeF350" hidden>上次玩的</span>
        </span>
        <span class="pc-sub">明骰 · 1 点 100、5 点 50，满 350 才能收</span>
      </button>
      </div>
    </div>
  </div>
</div>

<div class="page page-liar">

  <!-- 顶部：标题 -->
  <div class="nav">
    <button class="nav-back" id="toSolo" aria-label="返回上一层">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.6 4.8 7.4 12l7.2 7.2"/>
      </svg>
    </button>
    <div class="sound-btn" id="soundBtn"><span class="sound-ic" id="soundIc">🔊</span></div>
    <div class="nav-title" id="titleBtn">
      <span class="t1">吹牛骰子</span>
      <span class="t2">LIAR'S DICE</span>
    </div>
    <!-- 骰子数量：点一下在按钮下面原地展开 2~10，不弹整屏的模态 -->
    <div class="count-btn" id="countBtn">
      <span id="countTxt">5 颗</span><i class="count-caret"></i>
    </div>
    <div class="drop drop-grid" id="countDrop" hidden></div>
    <div class="drop-shade" id="countShade" hidden></div>
  </div>

  <!-- 骰盅舞台 -->
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="table-ring"></div>

      <div class="cup-rig" id="cupRig">
        <div class="cup-body"></div>
        <div class="cup-mouth"><div class="mouth-rim"></div></div>
        <div class="dice-layer" id="diceLayer"></div>
        <div class="cup-rim"></div>

        <div class="lid-holder" id="lidHolder">
          <div class="lid">
            <div class="lid-side"></div>
            <div class="lid-top">
              <div class="lid-ring"></div>
              <div class="lid-gloss"></div>
            </div>
            <div class="knob"><div class="knob-hole"></div></div>
          </div>
        </div>
      </div>

      <div class="lock-tag" id="lockTag" style="display:none">已锁定</div>
    </div>

    <!-- 骰盅下方的空白桌面：从这里起手往上滑也能掀盖 -->
    <div class="hot-zone" id="hotZone"></div>
  </div>

  <!-- 底部操作区 -->
  <div class="controls">
    <div class="hint" id="hint">点「摇一摇」开始这一局</div>
    <div class="btn-row" id="btnRow"></div>
    <div class="foot">
      <span>v1.10.4</span>
      <button class="mode-link" id="ruleBtn">玩法说明</button>
    </div>
  </div>


</div>

<!-- ==================== 350 玩法（第二种玩法，无盖 · 明骰） ==================== -->
<div class="page page-f350" id="pageF350" hidden>

  <div class="nav">
    <button class="nav-back" id="toSolo2" aria-label="返回上一层">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.6 4.8 7.4 12l7.2 7.2"/>
      </svg>
    </button>
    <div class="nav-title">
      <span class="t1">350</span>
      <span class="t2">THREE FIFTY</span>
    </div>
    <!-- 人数：点一下在按钮下面原地展开，不弹层 -->
    <div class="count-btn" id="pCountBtn">
      <span id="pCountTxt">4 人</span><i class="count-caret"></i>
    </div>
    <div class="drop drop-grid" id="pDrop" hidden></div>
    <div class="drop-shade" id="pShade" hidden></div>
  </div>

  <!-- 玩家记分条：当前回合的人反色高亮 -->
  <div class="p-strip" id="pStrip"></div>

  <!-- 桌面：骰子直接摊开，没有盖 -->
  <div class="f3-stage">
    <div class="f3-table">
      <div class="f3-dice" id="f3Dice"></div>
    </div>
  </div>

  <!-- 本回合分数 -->
  <div class="f3-panel">
    <div class="f3-score" id="f3ScoreBox">
      <span class="f3-score-num" id="f3ScoreNum">0</span>
      <span class="f3-score-unit">本回合</span>
    </div>
    <!-- 这一回合已经收下的骰子：分数是它们加起来的结果 -->
    <div class="f3-taken" id="f3Taken" hidden></div>
    <div class="f3-hint" id="f3Hint">满 350 才能收手 · 封顶 700</div>
  </div>

  <div class="f3-btns" id="f3Btns"></div>

  <div class="foot">
    <button class="mode-link" id="ruleBtn2">玩法说明</button>
  </div>
</div>

<div class="f3-mask" id="f3Mask" style="display:none"></div>

<!-- ==================== 玩法说明（两个玩法共用，内容按玩法填） ==================== -->
<div class="rule-mask" id="ruleMask" style="display:none">
  <div class="rule-sheet">
    <div class="rule-head">
      <span class="rule-title" id="ruleTitle">玩法说明</span>
      <button class="rule-x" id="ruleClose">关闭</button>
    </div>
    <div class="rule-body" id="ruleBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="f350.js"></script>
</body>
</html>
