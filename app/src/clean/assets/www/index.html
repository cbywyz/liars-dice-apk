<meta name="theme-color" content="#f4f0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吹牛骰子">

<!-- ==================== 首页：先选单机 / 联机，再选玩法 ==================== -->
<div class="page page-home" id="pageHome">

  <div class="home">
    <div class="home-head">
      <div class="home-t1">骰子</div>
      <div class="home-t2">DICE</div>
    </div>

    <div class="home-cards">
      <!-- 单人：一台手机轮流玩，现有两个玩法都在这里 -->
      <button class="mode-card" id="modeSolo">
        <span class="mc-top">
          <svg class="mc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="8.6" cy="8.6" r="1.5" fill="currentColor"/>
            <circle cx="15.4" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="8.6" cy="15.4" r="1.5" fill="currentColor"/>
          </svg>
          <span class="mc-title">单人模式</span>
        </span>
        <span class="mc-sub">一台手机，大家轮着玩</span>
      </button>

      <!-- 联机：先占位。真做的时候主机是安卓端，其他手机浏览器当客户端 -->
      <button class="mode-card is-soon" id="modeNet">
        <span class="mc-top">
          <svg class="mc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5a12.5 12.5 0 0 1 16 0" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <path d="M7 13a8.2 8.2 0 0 1 10 0" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="17.6" r="1.7" fill="currentColor"/>
          </svg>
          <span class="mc-title">联机模式</span>
          <span class="mc-badge">开发中</span>
        </span>
        <span class="mc-sub">每人一台手机 · 连同一个 WiFi</span>
      </button>
    </div>

    <div class="home-tip" id="homeTip"></div>

    <!-- 添加到桌面：网页版没有安装包，但加完图标点开就是全屏，跟 App 一样。
         已经装过（standalone）或用户说过「不用了」就不显示，逻辑在 app.js 末尾 -->
    <button class="a2hs" id="addHome" hidden>
      <img class="a2hs-ic" src="apple-touch-icon.png" alt="" width="56" height="56">
      <span class="a2hs-tx">
        <span class="a2hs-t1">把骰子放到桌面</span>
        <span class="a2hs-t2">点图标就开 · 全屏没地址栏</span>
      </span>
      <svg class="a2hs-ar" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.4 5.4 16.2 12l-6.8 6.6"/>
      </svg>
    </button>

    <div class="home-foot">
      <span class="home-ver" id="homeVer">v1.10.22 · 仅供朋友聚会娱乐</span>
      <button class="home-legal" id="termsBtn">免责声明</button>
    </div>
  </div>
</div>

<!-- ==================== 单人模式：选玩法 ==================== -->
<div class="page page-solo" id="pageSolo" hidden>

  <div class="home">
    <button class="nav-back" id="soloBack" aria-label="返回首页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.6 4.8 7.4 12l7.2 7.2"/>
      </svg>
    </button>

    <!-- 标题 + 卡片包一层：让这一组在整页里垂直居中，别都挤在顶上 -->
    <div class="solo-body">
      <div class="home-head">
        <div class="home-t1">单人</div>
        <div class="home-t2">SOLO</div>
      </div>

      <div class="home-cards">
      <!-- 两个玩法的入口都摆在这一层，不再塞进玩法页的底栏 -->
      <button class="play-card" id="playLiar" data-play="liar">
        <span class="pc-top">
          <svg class="pc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.6 7.2h16.8" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="4.4" r="1.3" fill="currentColor"/>
            <path d="M6.1 10.4h11.8c0 5-2.5 8.6-5.9 8.6s-5.9-3.6-5.9-8.6z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
          </svg>
          <span class="pc-title">吹牛骰子</span>
          <span class="pc-badge" id="badgeLiar" hidden>上次玩的</span>
        </span>
        <span class="pc-sub">有盖子 · 摇完掀盖看点数，靠嘴吹</span>
      </button>

      <button class="play-card" id="playF350" data-play="f350">
        <span class="pc-top">
          <svg class="pc-ic" viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="6.2" rx="7" ry="2.5" fill="none"
                     stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 6.2v4.4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6.2"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 10.6v4.4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-4.4"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span class="pc-title">潮汕 350</span>
          <span class="pc-badge" id="badgeF350" hidden>上次玩的</span>
        </span>
        <span class="pc-sub">明骰 · 1 点 100、5 点 50，满 350 才能收</span>
      </button>

    </div>
    <div class="foot solo-foot">
      <span class="page-ver">v1.10.22</span>

<div class="page page-liar">

  <!-- 顶部：标题 -->
  <div class="nav">
    <button class="nav-back" id="toSolo" aria-label="返回上一层">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.6 4.8 7.4 12l7.2 7.2"/>
      </svg>
    </button>
    <div class="sound-btn" id="soundBtn"><span class="sound-ic" id="soundIc">🔊</span></div>
    <div class="nav-title" id="titleBtn">
      <span class="t1">吹牛骰子</span>
      <span class="t2">LIAR'S DICE</span>

    <!-- 骰子数量：点一下在按钮下面原地展开 2~10，不弹整屏的模态 -->

      <div class="table-ring"></div>

      <div class="cup-rig" id="cupRig">
        <div class="cup-body"></div>
        <div class="cup-mouth"><div class="mouth-rim"></div></div>
        <div class="dice-layer" id="diceLayer"></div>
        <div class="cup-rim"></div>

        <div class="lid-holder" id="lidHolder">

            <div class="lid-side"></div>
            <div class="lid-top">
              <div class="lid-ring"></div>
              <div class="lid-gloss"></div>
            </div>
            <div class="knob"><div class="knob-hole"></div></div>

        </div>
      </div>

    </div>

    <!-- 骰盅下方的空白桌面：从这里起手往上滑也能掀盖 -->

  <!-- 底部操作区 -->

<!-- ==================== 350 玩法（第二种玩法，无盖 · 明骰） ==================== -->

  <div class="f3-stage">
    <div class="f3-table">

    </div>
  </div>

  <!-- 本回合分数 -->

  <div class="f3-btns" id="f3Btns"></div>

  <div class="foot">
    <span class="page-ver">v1.10.22</span>
    <button class="mode-link" id="ruleBtn2">玩法说明</button>
  </div>

<script src="app.js"></script>
<script src="f350.js"></script>

<!-- 页签开太久会一直跑老脚本：手机上常见「关掉再开是新的，切回那个页签还是老的」。
     App 不会这样（APK 一装就是整包替换），网页只能自己发现。这里对一下线上的构建号，
     对不上就在「人在首页、没有进行中的牌局」时整页换成新的 —— 绝不刷掉打了一半的局。
     发布时脚本 URL 会带上 ?v=<commit>，本地文件和 APK 里没有这个参数，下面直接跳过。 -->
<script>
(function () {
  var tag = document.querySelector('script[src^="app.js"]');
  var mine = tag && /[?&]v=([^&]+)/.exec(tag.getAttribute('src') || '');
  mine = mine ? mine[1] : '';
  if (!mine) return;

  var busy = false;
  function atHome() {
    var h = document.getElementById('pageHome');
    return !!h && !h.hidden;
  }
  function check() {
    if (busy || document.hidden || !atHome()) return;
    busy = true;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        busy = false;
        if (!j || !j.v || j.v === mine) return;
        /* 换个参数整页重来：新页面引用的脚本自然是新构建号 */
        location.replace(location.pathname + '?b=' + j.v + location.hash);
      })
      .catch(function () { busy = false; });
  }

  setTimeout(check, 1800);
  document.addEventListener('visibilitychange', check);
})();
</script>

<!-- 离线：网页版装到桌面后要能断网摇，靠的是这个。
     以前 sw.js 写在目录里但从来没人注册，等于没有 —— 页面全靠现下载，
     飞行模式、酒桌上没信号、地铁里，打开就是白屏。这才是网页版唯一还不如 APK 的地方。
     更新策略全在 sw.js 里（联网一定拿最新的，断网才吃缓存），这里只管注册，
     **不接管刷新**：牌打到一半被 SW 刷掉，比没网严重得多。
     APK 是 file:// 加载，file:// 下浏览器根本不给 SW（navigator.serviceWorker 不存在），
     所以这一段在 APK 里自然什么都不做，两边不会打架。 -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      /* 顺手问一次有没有新版：不弹框、不刷页，装好了下次打开就是新的 */
      try { reg.update(); } catch (e) {}
    }).catch(function () {});
  });
})();
</script>
