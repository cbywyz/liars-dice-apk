<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吹牛骰子">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>吹牛骰子</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS「添加到主屏幕」用的图标：没有它 iPhone 桌面会显示网页截图 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="f350.css">
</head>
<body>

<div class="page page-liar">

  <!-- 顶部：标题（长按 1.2 秒 = 隐藏入口） -->
  <div class="nav">
    <div class="sound-btn" id="soundBtn"><span class="sound-ic" id="soundIc">🔊</span></div>
    <div class="nav-title" id="titleBtn">
      <span class="t1">吹牛骰子</span>
      <span class="t2">LIAR'S DICE</span>
    </div>
    <!-- 骰子数量：公开功能，点了从底部弹一条 2~10 的选择 -->
    <div class="count-btn" id="countBtn">
      <span id="countTxt">5 颗</span><i class="count-caret"></i>
    </div>
  </div>

  <!-- 骰盅舞台 -->
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="table-ring"></div>

      <div class="cup-rig" id="cupRig">
        <div class="cup-body"></div>
        <div class="cup-mouth"><div class="mouth-rim"></div></div>
        <div class="dice-layer" id="diceLayer"></div>
        <div class="cup-rim"></div>

        <div class="lid-holder" id="lidHolder">
          <div class="lid">
            <div class="lid-side"></div>
            <div class="lid-top">
              <div class="lid-ring"></div>
              <div class="lid-gloss"></div>
            </div>
            <div class="knob"><div class="knob-hole"></div></div>
          </div>
        </div>
      </div>

      <div class="lock-tag" id="lockTag" style="display:none">已锁定</div>
    </div>

    <!-- 隐藏入口：点骰盅下方的空白桌面（没任何视觉提示） -->
    <div class="hot-zone" id="hotZone"></div>
  </div>

  <!-- 底部操作区 -->
  <div class="controls">
    <div class="hint" id="hint">点「摇一摇」开始这一局</div>
    <div class="btn-row" id="btnRow"></div>
    <div class="foot">
      <span>v1.10.0 · 仅供朋友聚会娱乐</span>
      <button class="mode-link" id="toF350">350 玩法</button>
    </div>
  </div>


  <!-- 隐藏面板：长按标题打开 -->
  <div class="mask" id="mask" style="display:none">
    <div class="sheet" id="sheet">
      <span class="sheet-title">点数设置</span>
      <span class="sheet-sub">仅本机生效 · 点了只装填，摇一摇才生效 · 仅一次</span>

      <div class="force-state" id="forceState">
        <div class="fs-dot"></div>
        <span class="fs-text" id="fsText"></span>
      </div>

      <div class="quick">
        <div class="quick-head">
          <span class="quick-title">一键豹子</span>
          <span class="quick-tip">点一下随机一个 · 摇一摇生效</span>
        </div>
        <div id="lionRow"></div>
        <div class="quick-row" id="straightRow"></div>
      </div>

      <div class="tapbox">
        <div class="tapbox-head">
          <div class="tapbox-text">
            <span class="tapbox-title">开盖后点骰改点</span>
            <span class="tapbox-sub">掀开后连点两下同一颗骰子，点数 +1 · 长期有效</span>
          </div>
          <label class="sw"><input type="checkbox" id="swTapEdit"><span class="track"></span></label>
        </div>
      </div>

      <div class="tapbox">
        <div class="tapbox-head">
          <div class="tapbox-text">
            <span class="tapbox-title">骰盅下方隐形区</span>
            <span class="tapbox-sub">开启后，点骰盅下方左 / 中 / 右三格才有效 · 默认关闭</span>
          </div>
          <label class="sw"><input type="checkbox" id="swHotZone"><span class="track"></span></label>
        </div>
      </div>

      <div class="switch-row">
        <span>音效</span>
        <label class="sw"><input type="checkbox" id="swSound"><span class="track"></span></label>
      </div>

      <button class="btn primary sheet-btn" id="panelDone">完成</button>
    </div>
  </div>

</div>

<!-- ==================== 350 玩法（第二种玩法，无盖 · 明骰） ==================== -->
<div class="page page-f350" id="pageF350" hidden>

  <div class="nav">
    <div class="nav-title">
      <span class="t1">350</span>
      <span class="t2">THREE FIFTY</span>
    </div>
  </div>

  <!-- 玩家记分条：当前回合的人反色高亮 -->
  <div class="p-strip" id="pStrip"></div>

  <!-- 桌面：骰子直接摊开，没有盖 -->
  <div class="f3-stage">
    <div class="f3-table">
      <div class="f3-dice" id="f3Dice"></div>
    </div>
  </div>

  <!-- 本回合分数 -->
  <div class="f3-panel">
    <div class="f3-score" id="f3ScoreBox">
      <span class="f3-score-num" id="f3ScoreNum">0</span>
      <span class="f3-score-unit">本回合</span>
    </div>
    <div class="f3-hint" id="f3Hint">满 350 才能收手 · 封顶 700</div>
  </div>

  <div class="f3-btns" id="f3Btns"></div>

  <div class="foot">
    <button class="mode-link" id="toLiar">吹牛骰子</button>
  </div>
</div>

<div class="f3-mask" id="f3Mask" style="display:none"></div>

<div class="toast" id="toast"></div>

<!-- 骰子数量选择：从底部升起的一条，点空白关掉 -->
<div class="count-mask" id="countMask" style="display:none">
  <div class="count-bar">
    <div class="count-head">
      <span class="count-name">骰子数量</span>
      <span class="count-sub">改数量会重新开一局</span>
    </div>
    <div class="count-list" id="countList"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="f350.js"></script>
</body>
</html>
