<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#1e4a31"/>
      <stop offset="55%" stop-color="#0e2a1b"/>
      <stop offset="100%" stop-color="#050d08"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c6a056" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#c6a056" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c6a056" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="22%" y1="6%" x2="78%" y2="96%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#e9dcc3"/>
    </linearGradient>
    <radialGradient id="pip" cx="36%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#5b98ef"/>
      <stop offset="55%" stop-color="#1f5ccd"/>
      <stop offset="100%" stop-color="#0c3480"/>
    </radialGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbb894"/>
      <stop offset="100%" stop-color="#9d8a68"/>
    </linearGradient>
  </defs>

  <!-- 满幅底：交给系统裁圆角/圆形，不做自己的圆角 -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <ellipse cx="540" cy="780" rx="470" ry="330" fill="url(#glow)"/>

  <g transform="rotate(-13 540 520)">
    <!-- 骰子厚度 -->
    <rect x="240" y="268" width="600" height="600" rx="132" fill="url(#edge)"/>
    <!-- 骰子正面 -->
    <rect x="240" y="240" width="600" height="600" rx="132" fill="url(#face)"/>
    <!-- 倒角高光 -->
    <rect x="252" y="252" width="576" height="576" rx="122" fill="none"
          stroke="#ffffff" stroke-opacity="0.85" stroke-width="10"/>

    <!-- 5 点 -->
    <circle cx="368" cy="368" r="60" fill="url(#pip)"/>
    <circle cx="712" cy="368" r="60" fill="url(#pip)"/>
    <circle cx="540" cy="540" r="64" fill="url(#pip)"/>
    <circle cx="368" cy="712" r="60" fill="url(#pip)"/>
    <circle cx="712" cy="712" r="60" fill="url(#pip)"/>
  </g>
</svg>
