plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace 'com.cbywyz.liarsdice'
    compileSdk 34

    defaultConfig {
        // applicationId / versionCode / versionName / app_name 全部下放到 flavor，
        // 这样同一份代码能出两个独立安装、互不覆盖的 App。
        minSdk 24
        targetSdk 34
    }

    // 2026-11-10 起只发网页版，APK 不跟着编，这两处版本号**故意停在 1.10.22**。
    // 以后真要发新版 App 时：versionName 改成网页版当前的版本号（index.html 里的 page-ver），
    // versionCode 各 +1，然后 dispatch 时勾上 with_apk。见 docs/build.md「发 APK 之前要做的三件事」。
    flavorDimensions "edition"
    productFlavors {
        // 完整版：带三格隐形区、点数设置面板、点骰改点
        full {
            dimension "edition"
            applicationId "com.cbywyz.liarsdice"
            versionCode 51
            versionName "1.10.22"
            resValue "string", "app_name", "吹牛骰子"
        }
        // 纯净版：只有摇骰 / 掀盖 / 锁定这些基本玩法，页面上和完整版长得一样
        clean {
            dimension "edition"
            applicationId "com.cbywyz.liarsdice.clean"
            versionCode 25
            versionName "1.10.22"
            resValue "string", "app_name", "吹牛骰子"
        }
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
                if (ks['storeType']) storeType ks['storeType']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 资源里没有 png 密度分级，关掉自动压缩避免报警告
    androidResources {
        noCompress 'mp3'
    }
}

dependencies {
}
