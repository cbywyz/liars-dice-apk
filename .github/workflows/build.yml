name: build

on:
  push:
    branches: [ main, master ]
    # 只改文档/截图不用重新编译打包（否则每次顺手改个 README 都要跑一遍十分钟的构建）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **两个玩法，两版都有**：吹牛骰子（默认，带盖子）和 350（无盖明骰）。

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            ## 本版改动 v${{ steps.ver.outputs.v }}

            **新增 350 玩法**（底部「350 玩法」切过去）

            - 不要盖子，明骰直接摇，固定 7 颗
            - 1 点算 100 分、5 点算 50 分，2/3/4/6 不计分
            - 摇完**自己点**要拿走的 1 和 5，**不点就不拿** —— 拿走一颗就少一颗骰子，
              下一把摇出 100 的机会就少一份，所以有人宁可不要那 50 分留着凑数量
            - 一把里一个 1 和 5 都没有 → 本回合分清零，拿回 7 颗重摇（不换人，摇到出分为止）
            - 满 350 才能收手，封顶 700（到顶自动锁）
            - 7 颗全是 1 和 5 → 记一次豹子（只做记录，不影响胜负），分数清零继续摇
            - 比锁定的分数，高者胜；同分时先收手的排前面

            **新增 骰子数量 2~10**（吹牛玩法，点顶部「5 颗」切换）

            - 9 档可选，每个数量的骰子边长和间距单独算，不是等比缩放
            - 10 颗摆成 5+5 也不会挤，2 颗也不会显得空
            - 数量记在本地，下次打开还是上次选的

            **界面**：350 的三种骰子状态分得开了 —— 能计分的只有暖光和半透明角标，
            点过的才有实心金边并抬起来，还没摇的只是个淡色空位。
          files: dist/*.apk
