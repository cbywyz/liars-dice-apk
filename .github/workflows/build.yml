name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），只有摇骰、掀盖、锁定 |

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            **本版改动**

            - 换了新图标：一只扣着的骰盅 + 一颗骰子；两版底色相同，只有骰子面不同（4 点红 = 完整版，6 点蓝 = 纯净版）
            - 新增纯净版：没有三格隐形区、没有点数设置面板、没有点骰改点，界面与完整版完全一致
            - 两个包是不同的 applicationId，可以装在同一台手机上互不覆盖
            - 网页版同步出两版：根路径是完整版，`/clean/` 是纯净版
          files: dist/*.apk
