name: build

on:
  push:
    branches: [ main, master ]
    # 只改文档/截图不用重新编译打包（否则每次顺手改个 README 都要跑一遍十分钟的构建）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **两个玩法，两版都有**：吹牛骰子（默认，带盖子）和 350（无盖明骰）。

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            ## 本版改动 v${{ steps.ver.outputs.v }}

            **首页 -> 单人 -> 选玩法，三层立起来了**

            - 打开 App 先到首页选模式；点「单人模式」不再是直接跳进吹牛骰子，
              而是到**玩法选择页**：吹牛骰子 / 潮汕 350 各一张卡，写清一句话规则
            - 上次玩过的那个玩法会挂「上次玩的」角标 —— **只提示，不自动跳**，
              不然中间这一层又成了摆设
            - 玩法页底栏改成「换玩法」，退回上一层；选玩法页底部「返回首页」
            - **联机模式**仍是占位：真做的方向是「一台安卓当主机，其他人用浏览器连同一个 WiFi」，
              只有 App 能监听端口，iPhone 只能当客户端

            **两个玩法都加了「玩法说明」**

            - 玩法页底栏点「玩法说明」，从底部升起一张卡片：上面分步讲操作，下面列规则
            - 吹牛骰子：App 只管摇和盖，说明写的是桌上通用的叫点打法（1 点万能、轮流往上叫、不信就开）
            - 350：1 点 100 / 5 点 50、不点就不拿、一炮无分清零、豹子、满 350 才锁、封顶 700、同分先收手的在前
            - 点「关闭」或卡片外空白都能收起

            **350：人数开局后还能改**

            - 顶栏右上角多了一个「N 人」，点开就能重选（之前选过一次就再也改不了）
            - 换了人数就重开一局，分数清零、回到 1 号；弹层里先把这句话写在最上面
            - 人数没变就只关掉面板，局不动 —— 点开看一眼不至于把分丢了

            **上一版新增、这版也在**

            - **350 音效**：摇骰子有声音了（复用吹牛那颗 shake.mp3）
            - **连点两下计分骰 = 直接收下**，两次点击隔开超过 320ms 仍是普通选中 / 取消

            - **350 玩法**：不要盖子明骰直接摇，1 点算 100、5 点算 50；摇完自己点要拿走的 1 和 5，
              不点就不拿；满 350 才能收手，封顶 700；一把没有 1 也没有 5 就清零重摇
            - **骰子数量 2~10**（吹牛玩法，点顶部「5 颗」切换），9 档每个数量的边长和间距单独算
          files: dist/*.apk
