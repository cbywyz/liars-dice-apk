name: build

# 2026-11-12 起：**网页只从 Cloudflare 发**（`wrangler deploy`），这个工作流只剩「编 APK」。
#   以前 push 到 main 还会再发一份静态镜像，等于同一个游戏有两个公开地址、还得各自
#   维护缓存号 —— 已去掉，仓库里不再出现第二个域名。
#
#   手动 dispatch（默认）        → 什么都不做（只发网页版时不用点它）
#   手动 dispatch + 勾 with_apk  → 编两份 APK + 出 Release
#
#   为什么默认不编：网页版加到桌面之后跟 APK 没区别 —— 全屏、无地址栏、断网可玩（Service Worker），
#   而且更新是「刷新即最新」，不用重装、不用清缓存。每版都编一次几分钟的包没意义。
on:
  workflow_dispatch:
    inputs:
      with_apk:
        description: '顺便编译两份 APK 并出 Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    # 两道门：手动触发 **并且** 勾了 with_apk 才编。手滑点一下 dispatch 不会把 APK 发出去。
    if: github.event_name == 'workflow_dispatch' && inputs.with_apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk]
    # 跟 apk 同一个门 —— 不然只发网页时，release 会因为 apk 被 skip 而报失败
    if: github.event_name == 'workflow_dispatch' && inputs.with_apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **网页版**（不用装、刷新即最新，iPhone 也能用）：地址不公开，需要的话找作者要。

            本版改了什么 → [更新说明](https://github.com/cbywyz/liars-dice-apk/blob/main/docs/changelog.md)
          files: dist/*.apk
