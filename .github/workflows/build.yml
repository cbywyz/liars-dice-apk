name: build

# 平时的改动只发网页版（40 秒左右），在手机上用浏览器验；验完确认没问题，
# 再手动触发一次（workflow_dispatch）才编 APK、出 Release ——
# 编一次 APK 要好几分钟，每版都编等于拿打包时间换试错次数。
on:
  push:
    branches: [ main, master ]
    # 只改文档/截图不用重新编译打包（否则每次顺手改个 README 都要跑一遍十分钟的构建）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    # 只认手动触发：push 只更新网页，不发版
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **两个玩法，两版都有**：吹牛骰子（默认，带盖子）和 350（无盖明骰）。

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            ## 本版改动 v${{ steps.ver.outputs.v }}

            **① 返回箭头搬到左上角**

            - 以前「← 返回」摆在底栏，和「玩法说明」挤在一行；现在统一挪到**左上角一个圆形方向箭头**，
              点一下就退一层，底栏那一行只留「玩法说明」
            - 选玩法页、吹牛页、350 页三个二级页面都有；吹牛页原来在左上角的音效按钮往右让了一格，
              三个按钮（箭头 / 音效 / 骰子数量）互不遮挡

            **② 12 个人排成 3 行，一屏全看得见**

            - 350 顶部的记分条从「一行横向滚动」改成**一排 4 个、多了往下折行**：
              12 人正好 3 行（1–4 / 5–8 / 9–12），不用再左右划去找几号
            - 人少时就是一行 4 个，卡片宽度固定，换人数布局不跳

            **③ 返回上一层，不再一滑就退出 App**

            - 安卓的返回键 / 侧滑手势以前一点就直接退出：单页应用不产生历史记录，
              壳只看 WebView 有没有上一页可退
            - 现在首页 → 单人 → 玩法，每切一层都压一条记录：**滑一次退一层，退到底再滑才退出**
            - 玩法页底栏的「换玩法」也改成「← 返回」，页内返回和系统返回走同一条记录，不会错位
            - 玩法说明、人数 / 数量下拉开着的时候，返回先收起这一层，页面留在原地

            **④ 人数和骰子数量都改成原地下拉**

            - 350 的「N 人」：点一下在按钮下面展开 **4~12 共 9 档**（3×3），选哪个当场生效，
              不用再找一个「开始」按钮确认；点面板外空白也能收起
            - 上限从 15 收到 12：一桌坐不下那么多人，格子也会铺出两行空位
            - 吹牛骰子的「N 颗」同样改成原地下拉（2~10 共 9 档），不再从底部升起一整条面板

            **⑤ 350 爆掉不再自动清零**

            - 以前摇出来一个 1 和一个 5 都没有，1.6 秒后自动拿回 7 颗 —— 一桌人经常还没看清就没了
            - 现在结果留在桌上，按钮只剩一个「清零重摇」，**谁看够了谁按**，没按之前画面一直不动
            - 顺带把爆掉时的「锁分」按钮收了：本回合分数已经是 0，锁无可锁

            **⑥ 收下的骰子摆在桌子和分数之间**

            - 以前收完分，桌上的 1 和 5 就没了，只剩一个往上跳的数字 —— 一回合打完，
              记不清这五百分是摇了几把、收了几个 1 几个 5 凑出来的
            - 现在每收一颗，桌面和「本回合」分数之间那块空当里就多一颗骰子，按收的先后从左往右排；
              换人、爆掉、豹子、重开都跟着分数一起清掉
            - **和桌上那副一样大**（16vw 上下，393 宽的屏上约 63px）：那颗 1 本来就是从桌上拿走的，
              落到这里还是原来那么大，一眼就能对上号
            - 摆不下就按可用高度自动排：一行、两行各算一遍取骰子更大的那个 ——
              7 颗是 4 + 3 两行，封顶 14 颗也塞得下，**不压桌面、不压分数**

            **⑦ 收了一颗，还能接着收**

            - 以前收下一颗骰子，相位立刻切到「等他摇」，桌上剩下的 1 和 5 看着还带着金边和分数角标，
              其实已经点不动了 —— 双击一颗之后再想收另外一颗，怎么点都没反应，只能重摇，点数白丢
            - 现在收完还有剩骰子就留在待选状态：**剩下的 1/5 照样能点、能双击**，一颗一颗收干净
            - 一颗没选的时候主按钮自动变成「摇剩下 N 颗」，不想收了直接摇；点了骰子又变回「收下 N 分」

            **⑧ 玩到一半退出去，回来接着打**

            - 以前退出 App 再进来：**本回合的分数还在，桌上却是 7 个空位**，得重新摇；
              摇完发现分数还是那笔，也不知道算不算数 —— 分数和骰子对不上，还找不到「重开一局」
            - 现在手牌、已经收下的那排骰子、本回合分数一起存着，**退出前什么样，回来还是什么样**：
              没来得及收的 1 和 5 照样亮着能点，主按钮照样是「摇剩下 N 颗」
            - 旧版本留下的「只有分数、没有骰子」的存档会被认出来，本回合分数直接清掉，
              不留一个孤零零的数字

            **⑨ 任何时候都能重开一局**

            - 点右上角「N 人」展开面板，最下面多了一条**「重开一局 · 分数清零」**
            - 打到一半想推倒重来、或者不想接着上一局，点它就行 ——
              以前只能靠一直锁分、或者改个人数变相重开

            **⑩ 输赢规矩写进 App：喝多少一眼看明白**

            - 玩法说明多一段「**输赢 · 喝多少**」：
              **爆掉**（一把没有 1 也没有 5）自己喝 **1 杯**；
              **15 豹**（1 和 5 混着）台上其他人每人 **1 杯**；
              **正豹**（清一色 1111111 / 5555555）其他人每人 **2 杯**；
              整局打完**分数最低的喝 2 杯**
            - 豹子那条的关键是**摇的人不喝**：一分不涨还要清零重摇，所以打到后面会有人专门去拼豹子
            - 提示也把杯数一起说了：「正豹！其他每人喝 2 杯 · 分数清零重摇」、
              「15 豹！其他每人喝 1 杯 · 分数清零重摇」、「爆了 · 喝 1 杯 · 分数清零」，
              结算页标题下面写「同分先收手的排前面 · **最低的喝 2 杯**」
            - 杯数是默认值，开局前按自己的量定，喝不了酒的喝水一样算数；App 只算分，不记谁喝了多少

            **上一版就有、这版照旧**

            - **三层结构**：首页选模式 → 单人里选玩法（两张卡 + 「上次玩的」角标，只提示不自动跳）→ 进去玩
            - **两个玩法都有「玩法说明」**：底栏点开，上面分步讲操作、下面列规则，按 App 里真实现的判定写
            - **350 玩法**：不要盖子明骰直接摇，1 点算 100、5 点算 50；摇完自己点要拿走的 1 和 5，
              不点就不拿；一把没有 1 也没有 5 就清零重摇；满 350 才能收手，封顶 700；同分先收手的在前
            - **连点两下计分骰 = 直接收下**，两次点击隔开超过 320ms 仍是普通选中 / 取消
            - **350 摇骰有音效**（复用吹牛那颗 shake.mp3）
            - **骰子数量 2~10**（吹牛玩法），9 档每个数量的边长和间距单独算
          files: dist/*.apk
