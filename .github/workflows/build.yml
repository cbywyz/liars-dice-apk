name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译 APK ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          APK=$(find out -name "*.apk" | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true

  # ---------- 苹果 + 浏览器：把同一份网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: echo "网页版地址 ${{ steps.deployment.outputs.page_url }}"
