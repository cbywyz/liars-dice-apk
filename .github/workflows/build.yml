name: build

# 平时的改动只发网页版（40 秒左右），在手机上用浏览器验；验完确认没问题，
# 再手动触发一次（workflow_dispatch）才编 APK、出 Release ——
# 编一次 APK 要好几分钟，每版都编等于拿打包时间换试错次数。
on:
  push:
    branches: [ main, master ]
    # 只改文档/截图不用重新编译打包（否则每次顺手改个 README 都要跑一遍十分钟的构建）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    # 只认手动触发：push 只更新网页，不发版
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      # 给 css/js 的 URL 挂上提交号：每次部署 URL 都不一样。
      # 之前出过「页面版本号是新的、豹子玩法还是旧的」—— Service Worker 和手机浏览器把
      # 旧 JS 缓存住了，清浏览器缓存也没用（清的是 HTTP 缓存，Cache Storage 还在）。
      # 换了 URL 之后旧缓存永远匹配不上，只能去网络上拿。
      # APK 那边不受影响：它读的是 file:///android_asset，本来就没有缓存问题。
      - name: Cache-bust css/js with commit sha
        run: |
          V="${GITHUB_SHA:0:7}"
          echo "commit $V"
          for f in site/index.html site/clean/index.html; do
            sed -i -E "s#(href|src)=\"(app|f350)\.(css|js)\"#\1=\"\2.\3?v=$V\"#g" "$f"
            echo "== $f =="
            grep -oE '(href|src)="(app|f350)\.(css|js)\?v=[^"]*"' "$f"
          done
          # 页签开太久时的版本对照：页面里那段自检脚本会来拿这个文件
          echo "{\"v\":\"$V\"}" > site/build.json
          echo "{\"v\":\"$V\"}" > site/clean/build.json
          cat site/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **两个玩法，两版都有**：吹牛骰子（默认，带盖子）和 350（无盖明骰）。

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            ## 本版改动 v${{ steps.ver.outputs.v }}

            **① 返回箭头搬到左上角**

            - 以前「← 返回」摆在底栏，和「玩法说明」挤在一行；现在统一挪到**左上角一个圆形方向箭头**，
              点一下就退一层，底栏那一行只留「玩法说明」
            - 选玩法页、吹牛页、350 页三个二级页面都有；吹牛页原来在左上角的音效按钮往右让了一格，
              三个按钮（箭头 / 音效 / 骰子数量）互不遮挡

            **② 12 个人排成 3 行，一屏全看得见**

            - 350 顶部的记分条从「一行横向滚动」改成**一排 4 个、多了往下折行**：
              12 人正好 3 行（1–4 / 5–8 / 9–12），不用再左右划去找几号
            - 人少时就是一行 4 个，卡片宽度固定，换人数布局不跳

            **③ 返回上一层，不再一滑就退出 App**

            - 安卓的返回键 / 侧滑手势以前一点就直接退出：单页应用不产生历史记录，
              壳只看 WebView 有没有上一页可退
            - 现在首页 → 单人 → 玩法，每切一层都压一条记录：**滑一次退一层，退到底再滑才退出**
            - 玩法页底栏的「换玩法」也改成「← 返回」，页内返回和系统返回走同一条记录，不会错位
            - 玩法说明、人数 / 数量下拉开着的时候，返回先收起这一层，页面留在原地

            **④ 人数和骰子数量都改成原地下拉**

            - 350 的「N 人」：点一下在按钮下面展开 **4~12 共 9 档**（3×3），选哪个当场生效，
              不用再找一个「开始」按钮确认；点面板外空白也能收起
            - 上限从 15 收到 12：一桌坐不下那么多人，格子也会铺出两行空位
            - 吹牛骰子的「N 颗」同样改成原地下拉（2~10 共 9 档），不再从底部升起一整条面板

            **⑤ 350 爆掉不再自动清零**

            - 以前摇出来一个 1 和一个 5 都没有，1.6 秒后自动拿回 7 颗 —— 一桌人经常还没看清就没了
            - 现在结果留在桌上，按钮只剩一个「清零重摇」，**谁看够了谁按**，没按之前画面一直不动
            - 顺带把爆掉时的「锁分」按钮收了：本回合分数已经是 0，锁无可锁

            **⑥ 收下的骰子摆在桌子和分数之间**

            - 以前收完分，桌上的 1 和 5 就没了，只剩一个往上跳的数字 —— 一回合打完，
              记不清这五百分是摇了几把、收了几个 1 几个 5 凑出来的
            - 现在每收一颗，桌面和「本回合」分数之间那块空当里就多一颗骰子，按收的先后从左往右排；
              换人、爆掉、豹子、重开都跟着分数一起清掉
            - **和桌上那副一样大**（16vw 上下，393 宽的屏上约 63px）：那颗 1 本来就是从桌上拿走的，
              落到这里还是原来那么大，一眼就能对上号
            - 摆不下就按可用高度自动排：一行、两行各算一遍取骰子更大的那个 ——
              7 颗是 4 + 3 两行，封顶 14 颗也塞得下，**不压桌面、不压分数**

            **⑦ 收了一颗，还能接着收**

            - 以前收下一颗骰子，相位立刻切到「等他摇」，桌上剩下的 1 和 5 看着还带着金边和分数角标，
              其实已经点不动了 —— 双击一颗之后再想收另外一颗，怎么点都没反应，只能重摇，点数白丢
            - 现在收完还有剩骰子就留在待选状态：**剩下的 1/5 照样能点、能双击**，一颗一颗收干净
            - 一颗没选的时候主按钮自动变成「摇剩下 N 颗」，不想收了直接摇；点了骰子又变回「收下 N 分」

            **⑧ 玩到一半退出去，回来接着打**

            - 以前退出 App 再进来：**本回合的分数还在，桌上却是 7 个空位**，得重新摇；
              摇完发现分数还是那笔，也不知道算不算数 —— 分数和骰子对不上，还找不到「重开一局」
            - 现在手牌、已经收下的那排骰子、本回合分数一起存着，**退出前什么样，回来还是什么样**：
              没来得及收的 1 和 5 照样亮着能点，主按钮照样是「摇剩下 N 颗」
            - 旧版本留下的「只有分数、没有骰子」的存档会被认出来，本回合分数直接清掉，
              不留一个孤零零的数字

            **⑨ 任何时候都能重开一局**

            - 点右上角「N 人」展开面板，最下面多了一条**「重开一局 · 分数清零」**
            - 打到一半想推倒重来、或者不想接着上一局，点它就行 ——
              以前只能靠一直锁分、或者改个人数变相重开

            **⑩ 输赢规矩写进 App：喝多少一眼看明白**

            - 玩法说明多一段「**输赢 · 喝多少**」：
              **爆掉**（一把没有 1 也没有 5）自己喝 **1 杯**，**7 颗全摇还爆掉喝双倍 2 杯**；
              **15 豹**（1 和 5 混着）台上其他人每人 **1 杯**；
              **正豹**（清一色 1111111 / 5555555）其他人每人 **2 杯**；
              整局打完**分数最低的喝 2 杯**
            - 豹子那条的关键是**摇的人不喝**：一分不涨还要清零重摇，所以打到后面会有人专门去拼豹子
            - 提示也把杯数一起说了：「正豹！其他每人喝 2 杯 · 收下换人，或清零重摇」、
              「15 豹！其他每人喝 1 杯 · 收下换人，或清零重摇」、「爆了 · 7 颗全摇 · 喝双倍 2 杯」，
              结算页标题下面写「同分先收手的排前面 · **最低的喝 2 杯**」
            - 杯数是默认值，开局前按自己的量定，喝不了酒的喝水一样算数；App 只算分，不记谁喝了多少

            **⑪ 豹子停在桌上，收不收由你说了算**

            - 以前摇出豹子，要么瞬间翻篇（骰子变回 7 个空位、分数归零，一桌人还没数清就没了），
              要么一律清零 —— 明明摇出全桌最大的一手，分却不算数
            - 现在豹子和爆掉一样**停在桌上**，但多给一条路，底部两个按钮：
              「**收下 N 分**」把这一把的 1 和 5 全算上（7 颗最少 350、最多 700），收完直接锁分换下一位；
              「**清零重摇**」分数归零、拿回 7 颗，**还是同一个人摇**
            - 收不收都不影响喝酒：正豹其他人 2 杯、15 豹 1 杯，提示就写在按钮上面
            - 一个都不按就退出 App，回来还是这一步：骰子、提示、豹子标记、两个按钮都在

            **⑫ 网页版：首页教你「把骰子放到桌面」**

            - iPhone 不能装 APK，网页版一直是「打开链接 → 自己找分享按钮」。现在首页底部多一条入口，
              点开**按机型给步骤**：iPhone 讲 Safari 的分享按钮在哪（并直说只能用 Safari），
              安卓讲右上角菜单里的「安装应用 / 添加到主屏幕」，微信/QQ 打开的会先教怎么跳浏览器
            - 安卓 Chrome 支持系统安装框的，点一下直接弹系统的，不用看步骤
            - 已经是从桌面图标打开的、或点过「不用了，以后别再提醒」，这条就不再出现
            - 加完图标、名字、启动画面都跟 APK 一样，打开也是全屏无地址栏

            **⑬ 首页加「免责声明」，首次打开自动弹一次**

            - 首页底部多一颗「**免责声明**」，随时能看；**第一次打开会自动弹一次**，点「我知道了」之后不再自动弹
            - 就三句：**只能朋友之间娱乐**、**不得用于任何非法用途**、**其他功能与本工具无关**（按现状提供、
              出了事自己承担），外加一句分数只存在**本机**、不上传服务器
            - **不提钱、不提酒、不点名隐藏功能、不放仓库链接** —— 这是给桌上朋友看的一句话说明，不是分发协议
            - 这块**只占屏幕四成**，首页的「骰子」标题和两张模式卡还看得见 —— 首次打开就压满一屏，
              等于今天先别玩了
            - 点空白处只收起来、**不算看过** —— 手滑点掉的那次不该把说明吞掉，下次照样弹

            **⑭ 网页版：页签不会一直停在旧版上**

            - 手机上那个开了好几天没关的页签，跑的是几天前加载的 JS：摇出豹子还能接着摇、分数还照加，
              和装了新的 App 完全不一样。**关掉重开就好了**，但没人会想到去关
            - 现在页面自己会比对线上的构建号（`build.json`），对不上就整页换新 —— 只在**人在首页、
              没有进行中的牌局**时换，绝不刷掉打了一半的局；页面切到后台时不查，切回来再查
            - 已经停在旧版本的页签救不回来（那段自检代码本身也在新版本里），**关掉重开一次**即可，
              之后就不用手动了

            **⑮ 摇出豹子直接弹选择框：收下锁分 / 清零重摇**

            - 以前豹子只在底栏换两个按钮，摇完盯着桌上数骰子的人根本不往下看，回过神来就以为
              「摇出豹子没得选」。现在**豹子一出来就压一层**：标题、正豹还是 15 豹、这一把值多少分
              （整张卡最大的一行，隔着桌子也看得见），下面只有两条路 ——「收下 N 分」「清零重摇」
            - **点空白处关不掉**：这一步必须拿主意，不能手滑点没了
            - 底栏那两个同名按钮还在，和弹窗走同一份代码，不会出现「底栏收下 550、弹窗收下别的数」
            - 顺手修掉一个真 bug：**空存档第一次进 350 是一张 0 人的空桌**，这时摇出豹子点「收下」
              会抛异常、界面卡在旧按钮上 —— 也就是「没得选」的另一种成因。现在进来就把桌子摆好，
              人数下拉照旧摊开问一遍

            **顺手修的两件事（都在网页版）**

            - 之前出过「页面版本号是新的、豹子玩法还是旧的」：手机浏览器把旧 JS 记在 HTTP 缓存里，
              **清浏览器缓存也没用**（很多国产浏览器「清理缓存」只清一部分）。现在发布时给 css/js 的
              URL 挂上提交号，每次部署 URL 都不一样，旧缓存永远匹配不上
            - 断网时这些带参数的 URL 在缓存里找不到，回退那一步加了 `ignoreSearch`，不至于拿一份 HTML 当 JS 用

            **上一版就有、这版照旧**

            - **三层结构**：首页选模式 → 单人里选玩法（两张卡 + 「上次玩的」角标，只提示不自动跳）→ 进去玩
            - **两个玩法都有「玩法说明」**：底栏点开，上面分步讲操作、下面列规则，按 App 里真实现的判定写
            - **350 玩法**：不要盖子明骰直接摇，1 点算 100、5 点算 50；摇完自己点要拿走的 1 和 5，
              不点就不拿；一把没有 1 也没有 5 就清零重摇；满 350 才能收手，封顶 700；同分先收手的在前
            - **连点两下计分骰 = 直接收下**，两次点击隔开超过 320ms 仍是普通选中 / 取消
            - **350 摇骰有音效**（复用吹牛那颗 shake.mp3）
            - **骰子数量 2~10**（吹牛玩法），9 档每个数量的边长和间距单独算
          files: dist/*.apk
