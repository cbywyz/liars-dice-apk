name: build

on:
  push:
    branches: [ main, master ]
    # 只改文档/截图不用重新编译打包（否则每次顺手改个 README 都要跑一遍十分钟的构建）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 安卓：编译两份 APK（完整版 + 纯净版） ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APKs (full + clean)
        run: gradle assembleFullRelease assembleCleanRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/full  -name '*.apk' | head -1)" out/liars-dice-full.apk
          cp "$(find app/build/outputs/apk/clean -name '*.apk' | head -1)" out/liars-dice-clean.apk
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: liars-dice-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Show signature
        run: |
          for APK in out/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          done

  # ---------- 苹果 + 浏览器：把两版网页发到 GitHub Pages ----------
  # iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就是桌面图标 + 全屏 + 离线可用
  #   根路径 /    → 完整版
  #   /clean/     → 纯净版
  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (full at root, clean at /clean/)
        run: |
          mkdir -p site/clean
          cp -r app/src/full/assets/www/.  site/
          cp -r app/src/clean/assets/www/. site/clean/
          echo "--- 根目录（完整版）"
          ls site/
          echo "--- /clean/（纯净版）"
          ls site/clean/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "完整版 ${{ steps.deployment.outputs.page_url }}"
          echo "纯净版 ${{ steps.deployment.outputs.page_url }}clean/"

  # ---------- 自动发布：每次构建完都挂一个带两个 APK 的 Release ----------
  release:
    needs: [apk, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "读取到 versionName = $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: liars-dice-apk
          path: dist

      - name: Rename APKs
        run: |
          cp dist/liars-dice-full.apk  "dist/liars-dice-${{ steps.ver.outputs.v }}.apk"
          cp dist/liars-dice-clean.apk "dist/liars-dice-clean-${{ steps.ver.outputs.v }}.apk"
          rm -f dist/liars-dice-full.apk dist/liars-dice-clean.apk
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 吹牛骰子 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            **两个安卓包，装哪个都行，可以同时装（互不覆盖）**

            | 文件 | 说明 |
            |---|---|
            | `liars-dice-${{ steps.ver.outputs.v }}.apk` | 完整版，图标骰子 4 点（红），带隐藏的顺子 / 豹子 / 改点 |
            | `liars-dice-clean-${{ steps.ver.outputs.v }}.apk` | 纯净版，图标骰子 6 点（蓝），没有隐藏功能 |

            **两个玩法，两版都有**：吹牛骰子（默认，带盖子）和 350（无盖明骰）。

            **iPhone / 其他手机**

            - 完整版 https://cbywyz.github.io/liars-dice-apk/
            - 纯净版 https://cbywyz.github.io/liars-dice-apk/clean/

            （Safari → 分享 → 添加到主屏幕，就是桌面图标 + 全屏 + 离线可用）

            ## 本版改动 v${{ steps.ver.outputs.v }}

            **① 返回上一层，不再一滑就退出 App**

            - 安卓的返回键 / 侧滑手势以前一点就直接退出：单页应用不产生历史记录，
              壳只看 WebView 有没有上一页可退
            - 现在首页 → 单人 → 玩法，每切一层都压一条记录：**滑一次退一层，退到底再滑才退出**
            - 玩法页底栏的「换玩法」也改成「← 返回」，页内返回和系统返回走同一条记录，不会错位
            - 玩法说明、人数 / 数量下拉开着的时候，返回先收起这一层，页面留在原地

            **② 人数和骰子数量都改成原地下拉**

            - 350 的「N 人」：点一下在按钮下面展开 **4~12 共 9 档**（3×3），选哪个当场生效，
              不用再找一个「开始」按钮确认；点面板外空白也能收起
            - 上限从 15 收到 12：一桌坐不下那么多人，格子也会铺出两行空位
            - 吹牛骰子的「N 颗」同样改成原地下拉（2~10 共 9 档），不再从底部升起一整条面板

            **③ 350 爆掉不再自动清零**

            - 以前摇出来一个 1 和一个 5 都没有，1.6 秒后自动拿回 7 颗 —— 一桌人经常还没看清就没了
            - 现在结果留在桌上，按钮只剩一个「清零重摇」，**谁看够了谁按**，没按之前画面一直不动
            - 顺带把爆掉时的「锁分」按钮收了：本回合分数已经是 0，锁无可锁

            **上一版就有、这版照旧**

            - **三层结构**：首页选模式 → 单人里选玩法（两张卡 + 「上次玩的」角标，只提示不自动跳）→ 进去玩
            - **两个玩法都有「玩法说明」**：底栏点开，上面分步讲操作、下面列规则，按 App 里真实现的判定写
            - **350 玩法**：不要盖子明骰直接摇，1 点算 100、5 点算 50；摇完自己点要拿走的 1 和 5，
              不点就不拿；一把没有 1 也没有 5 就清零重摇；满 350 才能收手，封顶 700；同分先收手的在前
            - **连点两下计分骰 = 直接收下**，两次点击隔开超过 320ms 仍是普通选中 / 取消
            - **350 摇骰有音效**（复用吹牛那颗 shake.mp3）
            - **骰子数量 2~10**（吹牛玩法），9 档每个数量的边长和间距单独算
          files: dist/*.apk
