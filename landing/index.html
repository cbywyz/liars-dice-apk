<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e9">
<title>吹牛骰子 · 选一个版本</title>
<!--
  根路径只做一件事：让人挑版本。

  2026-11-10 之前根路径就是完整版：把 /clean/ 后面那几个字母删掉，掉进来的就是完整版 ——
  想给客人玩纯净版，一不小心就把顺子/豹子/改点全露出来了。现在两版都在子目录里
  （/full/ 和 /clean/），根路径是这张选择页，删掉后缀只会到这里，不会误入任何一个版本。

  这一页刻意做成「零依赖、单文件」：不注册 Service Worker、不引 app.css，
  样式全内联 —— 它要在这个站点的任何一次部署里都能打开，包括以后改了别的东西。
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw 5vw calc(6vw + env(safe-area-inset-bottom));
    background: radial-gradient(120% 78% at 50% 0%, #fdfaf5 0%, #f4f0e9 46%, #e9e2d6 100%);
    color: #23262d;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 440px; }

  .kicker {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: rgba(35, 38, 45, 0.38);
    text-align: center;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    text-align: center;
    font-weight: 700;
  }
  .lead {
    margin: 0 0 26px;
    font-size: 13.5px;
    line-height: 1.7;
    color: rgba(35, 38, 45, 0.55);
    text-align: center;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    margin-bottom: 12px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 2px 3px rgba(35, 38, 45, 0.05), 0 10px 24px rgba(35, 38, 45, 0.07);
    text-decoration: none;
    color: inherit;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .card:active { transform: scale(0.985); box-shadow: 0 1px 2px rgba(35, 38, 45, 0.06); }
  .card img {
    width: 54px; height: 54px;
    border-radius: 14px;
    flex: 0 0 auto;
    box-shadow: 0 3px 8px rgba(35, 38, 45, 0.14);
  }
  .tx { flex: 1 1 auto; min-width: 0; }
  .t {
    display: block;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 3px;
  }
  .d {
    display: block;
    font-size: 12.5px;
    line-height: 1.55;
    color: rgba(35, 38, 45, 0.5);
  }
  .arrow {
    flex: 0 0 auto;
    font-size: 20px;
    color: rgba(35, 38, 45, 0.22);
    line-height: 1;
  }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 500;
    vertical-align: 2px;
    letter-spacing: 0.02em;
  }
  .card.full .tag { background: rgba(191, 74, 58, 0.12); color: #a63c2c; }
  .card.clean .tag { background: rgba(43, 95, 168, 0.12); color: #2b5fa8; }

  .note {
    margin: 22px 0 0;
    font-size: 11.5px;
    line-height: 1.75;
    color: rgba(35, 38, 45, 0.4);
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <div class="kicker">潮汕 350 · 吹牛骰子</div>
  <h1>吹牛骰子</h1>
  <p class="lead">两个版本玩法完全一样，<br>区别只在有没有那三个隐藏功能。</p>

  <a class="card full" href="full/">
    <img src="full/icon-192.png" alt="" width="54" height="54">
    <span class="tx">
      <span class="t">完整版<span class="tag">4 点红</span></span>
      <span class="d">带隐藏的顺子 / 豹子 / 改点</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <a class="card clean" href="clean/">
    <img src="clean/icon-192.png" alt="" width="54" height="54">
    <span class="tx">
      <span class="t">纯净版<span class="tag">6 点蓝</span></span>
      <span class="d">没有隐藏功能 · 别人拿去玩也放心</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <p class="note">加到桌面就是 App：全屏、断网也能摇。<br>两版图标不同，可以同时装。</p>
</main>

<script>
/* 迁移打扫：以前根路径就是完整版，装到桌面的那个图标 start_url 指向 /，控制它的
   Service Worker 也挂在根作用域上。现在根路径变成选择页，那个旧 SW 留着只会拿它缓存里的
   旧页面顶上来 —— 这里把它注销掉。只动根作用域的那一个：/full/、/clean/ 各有自己的作用域，
   别去碰。缓存不删，同名家族里的旧缓存等 /full/ 自己的 SW 下次 activate 时会顺手清掉。 */
(function () {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return;
  var root = new URL('.', location.href).pathname;
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) {
      var p = '';
      try { p = new URL(r.scope).pathname; } catch (e) { return; }
      if (p === root) r.unregister();
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
